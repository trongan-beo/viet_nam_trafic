server {
    listen 80;
    listen [::]:80;
    server_name localhost trafficai.online www.trafficai.online traffiai.online www.traffiai.online _;

    client_max_body_size 50M;

    # Frontend React application
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend FastAPI API endpoints & static assets
    location ~ ^/(auth|audit-log|cameras|detect-vehicle|detect-plate|detect-plate-v2|check-violation|process-video|jobs|realtime-frame|stream-frame|review-queue|lookup-plate|violations|debug|uploads|evidence|health|docs|openapi.json|api) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
