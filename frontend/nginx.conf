server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container
    location ~ ^/(auth|audit-log|cameras|detect-vehicle|detect-plate|detect-plate-v2|check-violation|process-video|jobs|realtime-frame|stream-frame|review-queue|lookup-plate|violations|debug|uploads|evidence|health|docs|openapi.json|api) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}
